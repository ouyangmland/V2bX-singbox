name: Build and Release

permissions:
  contents: write
  actions: write
  attestations: write
  checks: write
  deployments: write
  discussions: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

on:
  workflow_dispatch:
  repository_dispatch:
    types: [new-mod-release]
  schedule:
    # Check sing-box_mod releases every 6 hours
    - cron: '15 */6 * * *'
  push:
    branches:
      - main
      - dev_new
  release:
    types: [published]

jobs:
  check_mod_release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check latest sing-box_mod release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 << 'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          import urllib.request

          token = os.environ.get("GH_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          mod_releases = fetch("https://api.github.com/repos/ouyangmland/sing-box_mod/releases?per_page=50")
          mod_tags = [
              r.get("tag_name", "")
              for r in mod_releases
              if r.get("tag_name", "").startswith("v") and "v2bx" not in r.get("tag_name", "")
          ]
          if not mod_tags:
              print("should_build=false")
              print("tag=")
              sys.exit(0)

          latest = mod_tags[0]
          v2bx_releases = fetch("https://api.github.com/repos/ouyangmland/V2bX-singbox/releases?per_page=50")
          existing = {r.get("tag_name", "") for r in v2bx_releases}
          if latest in existing:
              print("should_build=false")
              print("tag=")
          else:
              print("should_build=true")
              print(f"tag={latest}")
          PY

  build:
    needs: check_mod_release
    if: github.event_name != 'schedule' || needs.check_mod_release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Get version
        id: version
        run: |
          EVENT="${{ github.event_name }}"
          PAYLOAD_TAG="${{ github.event.client_payload.tag }}"
          if [ "$EVENT" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "$EVENT" = "repository_dispatch" ] && [ -n "$PAYLOAD_TAG" ]; then
            VERSION="$(echo "$PAYLOAD_TAG" | sed 's/^v//' | cut -d- -f2-)"
          elif [ "$EVENT" = "schedule" ]; then
            VERSION="$(echo "${{ needs.check_mod_release.outputs.tag }}" | sed 's/^v//' | cut -d- -f2-)"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # When triggered from a tag ref, github.ref_name contains the tag name
            REF_NAME="${{ github.ref_name }}"
            if [[ "$REF_NAME" == v2bx-* ]] || [[ "$REF_NAME" == v*.* ]]; then
              VERSION="$(echo "$REF_NAME" | sed 's/^v//' | cut -d- -f2-)"
            else
              VERSION="${GITHUB_SHA:0:8}"
            fi
          else
            VERSION="${GITHUB_SHA:0:8}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "FILENAME_AMD64=V2bX-linux-amd64.zip" >> $GITHUB_ENV
          echo "FILENAME_ARM64=V2bX-linux-arm64.zip" >> $GITHUB_ENV
      - name: Build amd64 (Alpine/musl)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          printf '#!/bin/sh\ngo mod download\ngo build -ldflags="-X github.com/MoeclubM/V2bX/cmd.version=${VERSION} -s -w" -tags "sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -o V2bX-linux-amd64 .\n' > build-amd64.sh
          docker run --rm \
            -v "$PWD":/build \
            -w /build \
            -e CGO_ENABLED=0 \
            -e GOARCH=amd64 \
            -e GOEXPERIMENT=jsonv2 \
            --env VERSION="$VERSION" \
            golang:1.25-alpine \
            sh /build/build-amd64.sh
          ls -lh V2bX-linux-amd64
      - name: Build arm64 (Alpine/musl)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          printf '#!/bin/sh\ngo mod download\ngo build -ldflags="-X github.com/MoeclubM/V2bX/cmd.version=${VERSION} -s -w" -tags "sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -o V2bX-linux-arm64 .\n' > build-arm64.sh
          docker run --rm \
            -v "$PWD":/build \
            -w /build \
            -e CGO_ENABLED=0 \
            -e GOARCH=arm64 \
            -e GOEXPERIMENT=jsonv2 \
            --env VERSION="$VERSION" \
            golang:1.25-alpine \
            sh /build/build-arm64.sh
          ls -lh V2bX-linux-arm64
      - name: Prepare amd64
        run: |
          mkdir -p build_amd64
          cp README.md LICENSE build_amd64/ 2>/dev/null || true
          cp example/*.json build_amd64/ 2>/dev/null || true
          cp V2bX-linux-amd64 build_amd64/V2bX
          cd build_amd64
          zip -9vr "../V2bX-linux-amd64.zip" . -x "*.DS_Store"
      - name: Prepare arm64
        run: |
          mkdir -p build_arm64
          cp README.md LICENSE build_arm64/ 2>/dev/null || true
          cp example/*.json build_arm64/ 2>/dev/null || true
          cp V2bX-linux-arm64 build_arm64/V2bX
          cd build_arm64
          zip -9vr "../V2bX-linux-arm64.zip" . -x "*.DS_Store"
      - name: Upload amd64
        uses: actions/upload-artifact@v6
        with:
          name: V2bX-linux-amd64
          path: ${{ env.FILENAME_AMD64 }}
      - name: Upload arm64
        uses: actions/upload-artifact@v6
        with:
          name: V2bX-linux-arm64
          path: ${{ env.FILENAME_ARM64 }}
      - name: Get tag for release
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="${{ needs.check_mod_release.outputs.tag }}"
          else
            TAG=""
          fi
          # Strip v prefix and v2bx- prefix for display name
          RELEASE_NAME="V2bX $(echo "$TAG" | sed 's/^v//' | cut -d- -f2-)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_ENV

      - name: Create Release
        if: steps.get_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          files: |
            ${{ env.FILENAME_AMD64 }}
            ${{ env.FILENAME_ARM64 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
